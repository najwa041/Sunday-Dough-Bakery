<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Sunday Dough Bakery</title>
        <link rel="stylesheet" href="style.css">

    </head>
    <body>
        <!--for the nav bar-->
        <nav >
            <h4 class="logo">SUNDAY DOUGH <br> Bakery</h4>
            <div class="navA">
             <a href="home.html" target="_self"><h6>HOME</h6></a>
             <a href="recipes.html" target="_self"><h6>RECIPES</h6></a>
             <a href="faq.html" target="_self"><h6>FAQ</h6></a>
             <a href="submite-recipe.html" target="_self"><h6>SUBMITE RECIPE</h6></a>
            </div>
        </nav>
        
        <!--for the SUBMITE-RECIPE part-->
        <main class="submitrecipe">
            <h2 class="sharerecipe">Submite Your Recipe</h2>
            <p class="aftershare">Share your homemade favorites with our community.</p>
            <div class="form">
            <form>
                <label for="yourname">Your Name:</label><br>
                <input type="text" id="yourname" name="yourname"/><br><br>
                <label for="recipename">Recipe Name</label><br>
                <input type="text" id="recipename" name="recipename"/><br><br>
                <label for="category">Recipe Category:</label><br>
                    <select name="category" id="category">
                    <option value="toyota">Cookies</option>
                    <option value="honda">Cakes</option>
                    <option value="mercedes">Breads</option>
                    <option value="bmw">Pastries</option>
                    <option value="mercedes">Sweet Rolls</option>
                    <option value="bmw">Muffins & Cupcakes</option>
                    </select><br><br>
                <label for="ingredients">Ingredients:</label><br>
                <textarea id="ingredients" name="ingredients" rows="10" cols="50"></textarea><br><br>
                <label for="instruction">Instruction: </label><br>
                <textarea id="instruction" name="instruction" rows="15" cols="50"></textarea><br><br>
                <button type="submit" class="buttonsubmit">Submit Recipe →</button>



            </form>
            </div>
        </main>
        
        <!--for the footer part-->
        <footer class="footer">
            
            <h4 class="logo1">SUNDAY DOUGH <br> Bakery</h4>

            <div class="fsentence">
            <p>Simple ingredients, extraordinary results.</p>
            <p>© 2026 Sunday Dough Bakery</p>
            </div>

        </footer>
    </body>
</html>
